name: Build Kernel Sancikrunul Anymore (Vayu)
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout Kernel Source
      uses: actions/checkout@v4

    - name: Setup Build Environment
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev

    - name: Download Toolchain & AnyKernel3
      run: |
        git clone --depth=1 https://github.com/kdrag0n/proton-clang.git clang
        git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel

    - name: Integrate KernelSU Next (Legacy)
      run: |
        curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s legacy

    - name: Inject Sancikrunul & Gaming Configs
      run: |
        sed -i 's/EXTRAVERSION =.*/EXTRAVERSION = -Sancikrunul-Anymore/g' Makefile
        
        DEFCONFIG="arch/arm64/configs/vayu_defconfig"
        
        if [ -f "$DEFCONFIG" ]; then
          sed -i 's/CONFIG_LOCALVERSION=.*/CONFIG_LOCALVERSION="-Sancikrunul"/g' $DEFCONFIG
          
          # Catatan: Optimasi Fastcharge dihapus untuk mencegah bootloop di HyperOS
          
          # Optimasi Gaming Performance
          echo "CONFIG_TCP_CONG_BBR=y" >> $DEFCONFIG
          echo "CONFIG_DEFAULT_TCP_CONG=\"bbr\"" >> $DEFCONFIG
          echo "CONFIG_IOSCHED_ZEN=y" >> $DEFCONFIG
          echo "CONFIG_IOSCHED_MAPLE=y" >> $DEFCONFIG
          echo "CONFIG_DEBUG_FS=n" >> $DEFCONFIG
          echo "CONFIG_DEBUG_KERNEL=n" >> $DEFCONFIG
          echo "CONFIG_KGSL_DEBUG=n" >> $DEFCONFIG
          echo "CONFIG_DEVFREQ_GOV_PERFORMANCE=y" >> $DEFCONFIG

          # Syarat Wajib KSU
          echo "CONFIG_KPROBES=y" >> $DEFCONFIG
          echo "CONFIG_HAVE_KPROBES=y" >> $DEFCONFIG
          echo "CONFIG_KPROBE_EVENTS=y" >> $DEFCONFIG
        else
          echo "Peringatan: File vayu_defconfig tidak ditemukan."
        fi

    - name: Compile Kernel
      run: |
        export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
        export ARCH=arm64
        export SUBARCH=arm64
        
        make O=out ARCH=arm64 vayu_defconfig
        
        make -j$(nproc --all) O=out ARCH=arm64 \
        CC=clang \
        CROSS_COMPILE=aarch64-linux-gnu- \
        CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
        LLVM=1 LLVM_IAS=1

    - name: Packaging Sancikrunul ZIP
      run: |
        if [ -f out/arch/arm64/boot/Image.gz-dtb ]; then
          cp out/arch/arm64/boot/Image.gz-dtb AnyKernel/
        elif [ -f out/arch/arm64/boot/Image.gz ]; then
          cp out/arch/arm64/boot/Image.gz AnyKernel/
        else
          cp out/arch/arm64/boot/Image AnyKernel/
        fi
        
        cd AnyKernel
        sed -i 's/kernel.string=.*/kernel.string=Sancikrunul (Gaming+KSUNext)/g' anykernel.sh
        
        # Penyesuaian AnyKernel3 Khusus HyperOS/MIUI
        sed -i 's/do.devicecheck=1/do.devicecheck=0/g' anykernel.sh
        sed -i 's/device.name1=.*/device.name1=vayu/g' anykernel.sh
        sed -i 's/device.name2=.*/device.name2=bhima/g' anykernel.sh
        sed -i 's|^block=.*|block=/dev/block/bootdevice/by-name/boot;|g' anykernel.sh
        sed -i 's/^is_slot_device=.*/is_slot_device=0;/g' anykernel.sh
        
        # Mencegah kerusakan ramdisk pada MIUI
        sed -i 's/do.modules=1/do.modules=0/g' anykernel.sh
        sed -i 's/do.systemless=1/do.systemless=0/g' anykernel.sh
        
        zip -r9 ../Sancikrunul-Anymore-HyperOS.zip * -x .git README.md *placeholder

    - name: Upload Kernel Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Sancikrunul-Anymore-HyperOS
        path: Sancikrunul-Anymore-HyperOS.zip
