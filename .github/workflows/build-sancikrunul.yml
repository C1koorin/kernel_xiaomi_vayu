name: Build Kernel Sancikrunul (Vayu)
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Kernel Source
      uses: actions/checkout@v4

    - name: Setup Build Environment
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev

    - name: Download Toolchain & AnyKernel3
      run: |
        git clone --depth=1 https://github.com/kdrag0n/proton-clang.git clang
        git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel

    - name: Inject Sancikrunul, Fastcharge & Gaming Configs
      run: |
        # 1. Mengubah nama kernel utama
        sed -i 's/EXTRAVERSION =.*/EXTRAVERSION = -Sancikrunul/g' Makefile
        
        DEFCONFIG="arch/arm64/configs/vendor/vayu-perf_defconfig"
        
        if [ -f "$DEFCONFIG" ]; then
          # 2. Identitas Sancikrunul di defconfig
          sed -i 's/CONFIG_LOCALVERSION=.*/CONFIG_LOCALVERSION="-Sancikrunul"/g' $DEFCONFIG
          
          # 3. Optimasi Fastcharge
          echo "CONFIG_USB_FASTCHARGE=y" >> $DEFCONFIG
          echo "CONFIG_QPNP_SMB5_FASTCHARGE=y" >> $DEFCONFIG
          echo "CONFIG_FAST_CHARGE=y" >> $DEFCONFIG
          echo "CONFIG_POWER_SUPPLY_DEBUG=n" >> $DEFCONFIG

          # ==========================================
          # 4. OPTIMASI GAMING PERFORMANCE
          # ==========================================
          
          # a. Algoritma Jaringan TCP BBR (Ping Stabil)
          echo "CONFIG_TCP_CONG_BBR=y" >> $DEFCONFIG
          echo "CONFIG_DEFAULT_TCP_CONG=\"bbr\"" >> $DEFCONFIG
          
          # b. I/O Scheduler untuk Loading Cepat (Zen & Maple)
          echo "CONFIG_IOSCHED_ZEN=y" >> $DEFCONFIG
          echo "CONFIG_IOSCHED_MAPLE=y" >> $DEFCONFIG
          
          # c. Mematikan Debugging Sistem (Mencegah Stuttering)
          echo "CONFIG_DEBUG_FS=n" >> $DEFCONFIG
          echo "CONFIG_DEBUG_KERNEL=n" >> $DEFCONFIG
          echo "CONFIG_KGSL_DEBUG=n" >> $DEFCONFIG
          
          # d. Governor GPU (Responsivitas Grafis)
          echo "CONFIG_DEVFREQ_GOV_PERFORMANCE=y" >> $DEFCONFIG
          
        else
          echo "Peringatan: File vayu-perf_defconfig tidak ditemukan."
        fi

    - name: Compile Kernel
      run: |
        export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
        export ARCH=arm64
        export SUBARCH=arm64
        
        make O=out ARCH=arm64 vendor/vayu-perf_defconfig
        
        # Build menggunakan LLVM agar performa maksimal
        make -j$(nproc --all) O=out ARCH=arm64 \
        CC=clang \
        CROSS_COMPILE=aarch64-linux-gnu- \
        CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
        LLVM=1 LLVM_IAS=1

    - name: Packaging Sancikrunul ZIP
      run: |
        if [ -f out/arch/arm64/boot/Image.gz-dtb ]; then
          cp out/arch/arm64/boot/Image.gz-dtb AnyKernel/
        elif [ -f out/arch/arm64/boot/Image.gz ]; then
          cp out/arch/arm64/boot/Image.gz AnyKernel/
        else
          cp out/arch/arm64/boot/Image AnyKernel/
        fi
        
        cd AnyKernel
        sed -i 's/kernel.string=.*/kernel.string=Sancikrunul (Gaming+Fastcharge)/g' anykernel.sh
        
        zip -r9 ../Sancikrunul-Vayu-Gaming.zip * -x .git README.md *placeholder

    - name: Upload Kernel Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Sancikrunul-Vayu-Gaming-ZIP
        path: Sancikrunul-Vayu-Gaming.zip
